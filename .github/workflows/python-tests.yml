name: Python regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install optional GIF encoder for full regression coverage
        run: python -m pip install -e ".[gif]"
      - name: Run synthetic-only unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate P4 private acceptance runner syntax (without private fixtures)
        shell: pwsh
        run: ./tools/p4_private_acceptance.ps1 -CheckSyntax
      - name: Validate P4 Python/Pillow native invocation (without private fixtures)
        shell: pwsh
        run: ./tools/p4_private_acceptance.ps1 -CheckPythonRuntime
