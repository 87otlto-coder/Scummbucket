name: Python regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run synthetic-only unit tests
        run: python -m unittest discover -s tests -v
